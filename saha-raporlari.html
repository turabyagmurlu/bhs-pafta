async function gir(){
  const rol=document.getElementById('rol').value, pw=document.getElementById('pw').value;
  if(!pw){ durum('Sifre gir'); return; }
  durum('Giris yapiliyor...');
  try{ await firebase.auth().signInWithEmailAndPassword(EMAP[rol], pw); }
  catch(e){ durum('Hata: '+(e.code==='auth/invalid-credential'?'Sifre hatali':(e.code||'giris basarisiz'))); }
}
firebase.auth().onAuthStateChanged(async function(u){
  if(!u){ goster(); return; }
  var y=document.getElementById('yuk'); if(y){ y.style.display='block'; y.textContent='Icerik aciliyor...'; }
  var b=document.getElementById('box'); if(b) b.style.display='none';
  try{
    const d=await firebase.firestore().collection('ayar').doc('raporKey').get();
    if(!d.exists || !d.data().key){ goster(); durum('Anahtar bulunamadi (yoneticiye sor)'); return; }
    await ac(d.data().key);
  }catch(e){ goster(); durum('Acilamadi: '+(e.code||e.message)); }
});
</script></body></html>
