  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='Açılıyor...';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){ err.textContent='❌ Parola yanlış'; document.getElementById('pw').select(); }
}
</script></body></html>
