function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function durum(t){var e=document.getElementById('err'); if(e) e.textContent=t;}
function goster(){ var y=document.getElementById('yuk'); if(y) y.style.display='none'; var b=document.getElementById('box'); if(b) b.style.display='block'; }
async function ac(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
  document.open();document.write(new TextDecoder().decode(pt));document.close();
}
async function gir(){
  const rol=document.getElementById('rol').value, pw=document.getElementById('pw').value;
  if(!pw){ durum('Sifre gir'); return; }
  durum('Giris yapiliyor...');
  try{ await firebase.auth().signInWithEmailAndPassword(EMAP[rol], pw); }
  catch(e){ durum('Hata: '+(e.code==='auth/invalid-credential'?'Sifre hatali':(e.code||'giris basarisiz'))); }
}
firebase.auth().onAuthStateChanged(async function(u){
  if(!u){ goster(); return; }
  var y=document.getElementById('yuk'); if(y){ y.style.display='block'; y.textContent='Icerik aciliyor...'; }
  var b=document.getElementById('box'); if(b) b.style.display='none';
  try{
    const d=await firebase.firestore().collection('ayar').doc('raporKey').get();
    if(!d.exists || !d.data().key){ goster(); durum('Anahtar bulunamadi (yoneticiye sor)'); return; }
    await ac(d.data().key);
  }catch(e){ goster(); durum('Acilamadi: '+(e.code||e.message)); }
});
</script></body></html>
