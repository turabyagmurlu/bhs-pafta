function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}

async function ac(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
  document.open();document.write(new TextDecoder().decode(pt));document.close();
}

  durum('Giris yapiliyor...');
  try{ await firebase.auth().signInWithEmailAndPassword(EMAP[rol], pw); }
  catch(e){ durum('Hata: '+(e.code==='auth/invalid-credential'?'Sifre hatali':(e.code||'giris basarisiz'))); }
}
